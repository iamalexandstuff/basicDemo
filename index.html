<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summerblox Moderators</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            font-family: "Comic Sans MS", "Comic Sans", cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 40px;
            max-width: 900px;
            width: 100%;
        }

        .character-image {
            max-width: 320px;
            height: auto;
            display: block;
        }

        .text-content {
            font-size: 2rem;
            font-weight: bold;
            font-style: italic;
            line-height: 1.3;
            color: #000000;
            max-width: 450px;
        }

        .text-content p {
            margin-bottom: 0.8em;
        }

        .text-content p:last-child {
            margin-bottom: 0;
        }

        /* Responsywność dla mniejszych ekranów / telefonów */
        @media (max-width: 650px) {
            .container {
                flex-direction: column;
                text-align: center;
                gap: 20px;
            }

            .text-content {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="iamalexandstuff.png" alt="Summerblox Moderator" class="character-image">
        <div class="text-content">
            <p>This, as Mush and Patric is one of the first ever Summerblox moderators.</p>
            <p>Fun fact: He has no fun fact, he's boring.</p>
        </div>
    </div>

</body>
</html>
